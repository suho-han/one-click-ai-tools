name: smoke-matrix

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-26.04 stays in the matrix until ubuntu-latest finishes its
        # rollover to 26.04 (2026-11-19, actions/runner-images#14748), so the
        # new image is exercised here before latest flips underneath us.
        os: [ubuntu-latest, ubuntu-26.04, macos-latest, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version format guard
        run: go test ./cmd -run TestRootVersionIsSemver -v

      - name: Go test
        run: go test ./...

      - name: Build smoke
        run: go build ./...
