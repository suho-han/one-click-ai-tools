name: goreleaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Run mode: snapshot for branch/manual test, release for tagged release'
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release
      git_ref:
        description: 'Optional git ref to checkout, for example v0.4.0'
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EFFECTIVE_RELEASE_TAG: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref_name }}
  OCT_ANALYTICS_ENDPOINT: ${{ vars.OCT_ANALYTICS_ENDPOINT }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}
      - name: Validate manual release ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release' }}
        run: |
          if [[ ! "$EFFECTIVE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: release_mode=release requires git_ref=vX.Y.Z"
            exit 1
          fi
      - name: Require self-hosted analytics endpoint for release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release')
        run: |
          if [[ -z "${OCT_ANALYTICS_ENDPOINT//[[:space:]]/}" ]] || [[ "$OCT_ANALYTICS_ENDPOINT" != https://* ]]; then
            echo "ERROR: set OCT_ANALYTICS_ENDPOINT to the verified HTTPS ingest URL before releasing"
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_mode == 'release' && 'release --clean' || 'release --clean --snapshot') || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  darwin-assets:
    name: build/upload darwin assets
    needs: goreleaser
    runs-on: macos-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Validate manual release ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release' }}
        run: |
          if [[ ! "$EFFECTIVE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: release_mode=release requires git_ref=vX.Y.Z"
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Stamp menubar helper version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          version = os.environ["EFFECTIVE_RELEASE_TAG"].removeprefix("v")
          endpoint = os.environ["OCT_ANALYTICS_ENDPOINT"]
          url = urlsplit(endpoint)
          if (url.scheme != "https" or not url.hostname or url.username is not None
                  or url.password is not None or url.query or url.fragment
                  or any(c.isspace() for c in endpoint)):
              raise SystemExit("OCT_ANALYTICS_ENDPOINT must be a valid HTTPS URL")
          literal = lambda value: json.dumps(value, ensure_ascii=False)
          Path("macos/OctMenubar/Sources/OctMenubarApp/BuildVersion.swift").write_text(
              "// Generated by .github/workflows/release.yml; do not edit.\n"
              "enum MenubarBuildVersion {\n"
              f"    static let version = {literal(version)}\n"
              f"    static let analyticsEndpoint = {literal(endpoint)}\n"
              f"    static let versionMarker = {literal('oct-menubar-helper-version=' + version)}\n"
              "}\n",
              encoding="utf-8",
          )
          PY
          cat macos/OctMenubar/Sources/OctMenubarApp/BuildVersion.swift

      - name: Build Swift menubar helper (universal)
        run: |
          set -euo pipefail
          # Xcode's swift is required: the SwiftUI macro plugins are missing
          # from the standalone CLT toolchain (same constraint as
          # 'oct menubar build-helper'). macos-latest images select Xcode.
          swift build --package-path macos/OctMenubar -c release \
            --arch x86_64 --arch arm64 --product OctMenubarApp
          # The universal product lives under a Products/Release/ dir of the
          # SwiftPM scratch dir; plain `find -name` would also match the
          # single-arch slices in the per-triple scratch dirs.
          helper_bin="$(find macos/OctMenubar/.build -type f -path '*Products/Release/OctMenubarApp' | head -n 1)"
          if [[ -z "$helper_bin" ]]; then
            echo "ERROR: OctMenubarApp binary not found after swift build"
            exit 1
          fi
          # dist/ is otherwise only created by the later darwin-build step.
          mkdir -p dist
          cp "$helper_bin" dist/OctMenubarApp
          file dist/OctMenubarApp
          # A universal build is required: the same helper rides in both the
          # amd64 and arm64 darwin tarballs.
          file dist/OctMenubarApp | grep -q "universal binary with 2 architectures" || {
            echo "ERROR: OctMenubarApp is not a universal binary"
            exit 1
          }
          # doctor finds the helper version by scanning the binary for this
          # marker; if dead-stripping removed it, doctor would report every
          # official helper as version "unknown" (happened through
          # 0.1.8-beta.1). The --version path prints the marker to keep the
          # bytes alive; assert they really landed in the artifact.
          version="${EFFECTIVE_RELEASE_TAG#v}"
          grep -aq "oct-menubar-helper-version=${version}" dist/OctMenubarApp || {
            echo "ERROR: oct-menubar-helper-version=${version} marker missing from dist/OctMenubarApp"
            exit 1
          }

      - name: Build darwin binaries
        run: |
          set -euo pipefail
          mkdir -p dist/tmp/amd64 dist/tmp/arm64
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build \
            -ldflags "-X github.com/suho-han/one-click-ai-tools/internal/telemetry.Endpoint=${OCT_ANALYTICS_ENDPOINT}" \
            -o dist/tmp/amd64/oct main.go
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build \
            -ldflags "-X github.com/suho-han/one-click-ai-tools/internal/telemetry.Endpoint=${OCT_ANALYTICS_ENDPOINT}" \
            -o dist/tmp/arm64/oct main.go
          cp dist/OctMenubarApp dist/tmp/amd64/OctMenubarApp
          cp dist/OctMenubarApp dist/tmp/arm64/OctMenubarApp
          tar -C dist/tmp/amd64 -czf dist/one-click-ai-tools_darwin_amd64.tar.gz oct OctMenubarApp
          tar -C dist/tmp/arm64 -czf dist/one-click-ai-tools_darwin_arm64.tar.gz oct OctMenubarApp

      - name: Verify helper inside darwin tarballs
        run: |
          set -euo pipefail
          rm -rf dist/helper-check && mkdir -p dist/helper-check
          for arch in amd64 arm64; do
            tarball="dist/one-click-ai-tools_darwin_${arch}.tar.gz"
            tar -tzf "$tarball" | grep -qx "OctMenubarApp" || {
              echo "ERROR: OctMenubarApp missing from ${tarball}"
              exit 1
            }
            tar -xzf "$tarball" -C dist/helper-check OctMenubarApp
            test -x dist/helper-check/OctMenubarApp || {
              echo "ERROR: OctMenubarApp in ${tarball} is not executable"
              exit 1
            }
            version="$(dist/helper-check/OctMenubarApp --version || true)"
            echo "OK: ${tarball} contains executable OctMenubarApp (${version})"
            rm -f dist/helper-check/OctMenubarApp
          done

      - name: Upload darwin assets to release
        run: |
          gh release upload "$EFFECTIVE_RELEASE_TAG" \
            dist/one-click-ai-tools_darwin_amd64.tar.gz \
            dist/one-click-ai-tools_darwin_arm64.tar.gz \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add darwin assets to checksums
        run: |
          set -euo pipefail
          gh release download "$EFFECTIVE_RELEASE_TAG" -p checksums.txt -D dist --clobber
          (
            cd dist
            awk '$2 !~ /^one-click-ai-tools_darwin_(amd64|arm64)\.tar\.gz$/ {print}' checksums.txt > checksums.tmp
            mv checksums.tmp checksums.txt
            shasum -a 256 one-click-ai-tools_darwin_amd64.tar.gz one-click-ai-tools_darwin_arm64.tar.gz >> checksums.txt
            sort -k2 checksums.txt -o checksums.txt
          )
          gh release upload "$EFFECTIVE_RELEASE_TAG" dist/checksums.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest-release-assets:
    name: attest release assets
    needs: [goreleaser, darwin-assets]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release')
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$EFFECTIVE_RELEASE_TAG" -R "$GITHUB_REPOSITORY" -D dist --clobber

      # Signs every published asset with a Sigstore build-provenance
      # attestation (artifact digest + builder identity = this repository's
      # GitHub Actions). Verified by the verify-release-assets job below, by
      # `oct update`, and by scripts/install.sh. Uses the official attest
      # action: `gh attestation sign` was removed from recent gh CLI
      # releases, so it cannot be relied on in CI.
      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  verify-release-assets:
    name: verify release assets
    needs: [goreleaser, darwin-assets, attest-release-assets]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Validate manual release ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode == 'release' }}
        run: |
          if [[ ! "$EFFECTIVE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: release_mode=release requires git_ref=vX.Y.Z"
            exit 1
          fi

      - name: Verify release integrity
        run: bash scripts/verify-release-integrity.sh
        env:
          RELEASE_TAG: ${{ env.EFFECTIVE_RELEASE_TAG }}
          OCT_VERIFY_ASSETS: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail-closed: the release must carry valid provenance attestations from
      # the attest-release-assets job. A missing or forged attestation fails
      # the release pipeline instead of shipping unsigned artifacts.
      - name: Verify artifact attestations
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$EFFECTIVE_RELEASE_TAG" -R "$GITHUB_REPOSITORY" -D dist --clobber
          cd dist
          for f in ./*.tar.gz ./*.zip; do
            [ -e "$f" ] || continue
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --digest-alg sha256
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release assets (macOS/Linux)
        run: |
          set -euo pipefail
          tag="$EFFECTIVE_RELEASE_TAG"
          required=(
            "one-click-ai-tools_linux_amd64.tar.gz"
            "one-click-ai-tools_linux_arm64.tar.gz"
            "one-click-ai-tools_darwin_arm64.tar.gz"
            "one-click-ai-tools_darwin_amd64.tar.gz"
            "checksums.txt"
          )

          assets_json="$(gh release view "$tag" --json assets)"
          for name in "${required[@]}"; do
            if ! echo "$assets_json" | jq -e --arg n "$name" '.assets[] | select(.name==$n)' >/dev/null; then
              echo "ERROR: missing release asset: $name (tag: $tag)"
              exit 1
            fi
            echo "OK: found release asset: $name"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
